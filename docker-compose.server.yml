services:
  db:
    image: postgres:15
    container_name: comptrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comptrol
    ports:
      # Solo loopback del servidor -- nunca 0.0.0.0. Acceso real solo vía tunel SSH
      # (ver openspec/changes/cargar-patrimonio-siga-staging/design.md, D1).
      - "127.0.0.1:5436:5432"
    volumes:
      - comptrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comptrol"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:20
    container_name: comptrol-api
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/api/.env.docker
    environment:
      NODE_ENV: "production"
      PORT: "3001"
      CHOKIDAR_USEPOLLING: "false"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    expose:
      - "3001"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    command: >
      sh -lc "test -x node_modules/.bin/nest || npm ci --include=dev;
      npx prisma generate;
      npx prisma migrate deploy;
      npm run build;
      npm run start:prod"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://localhost:3001/api/v1/health/ready',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: node:20
    container_name: comptrol-web
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-/api/v1}"
      API_PROXY_TARGET: "${API_PROXY_TARGET:-http://api:3001}"
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_POLLING: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: >
      sh -lc "test -x node_modules/.bin/next || npm install;
      npm run build;
      npm run start -- --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://localhost:3000/',res=>process.exit(res.statusCode>=200&&res.statusCode<500?0:1));req.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 30

volumes:
  comptrol_pgdata:
    name: comptrol_pgdata
  api_node_modules:
    name: comptrol_api_node_modules
  web_node_modules:
    name: comptrol_web_node_modules
